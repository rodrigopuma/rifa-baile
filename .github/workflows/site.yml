# Publica o frontend no GitHub Pages a cada push na branch main.
# Configure em: Settings → Pages → Source: "GitHub Actions"
# e em Settings → Secrets and variables → Actions → aba "Variables":
#   VITE_API_URL            ex.: https://rifa-baile-api.onrender.com
#   VITE_SUPABASE_URL       ex.: https://abcd.supabase.co
#   VITE_SUPABASE_ANON_KEY  chave pública "anon" (não é segredo)
name: Site (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["frontend/**", "campanha.json", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_ALLOW_DEV_TOKEN: "false"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
